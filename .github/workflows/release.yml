# Tag v* → quality → GHCR multi-arch → syft SBOM → cosign keyless.
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      - name: Check
        run: npm run check

      - name: Build
        run: npm run build

      - name: Read VERSION
        id: ver
        run: |
          FILE_VER=$(tr -d '[:space:]' < VERSION)
          TAG_VER="${GITHUB_REF_NAME#v}"
          if [ "$FILE_VER" != "$TAG_VER" ]; then
            echo "::error::VERSION file ($FILE_VER) does not match tag ($TAG_VER)"
            exit 1
          fi
          echo "version=${FILE_VER}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/hrodrig/gghstats-xui:v${{ steps.ver.outputs.version }}
            ghcr.io/hrodrig/gghstats-xui:latest
          build-args: |
            VERSION=${{ steps.ver.outputs.version }}
            REVISION=${{ github.sha }}
            BUILDDATE=${{ github.event.head_commit.timestamp }}
          provenance: true
          sbom: true

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Install syft
        uses: anchore/sbom-action/download-syft@v0

      - name: Generate image SBOM (syft)
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          IMAGE: ghcr.io/hrodrig/gghstats-xui:v${{ steps.ver.outputs.version }}
        run: |
          syft "${IMAGE}@${DIGEST}" -o spdx-json > "gghstats-xui_${{ steps.ver.outputs.version }}_image_sbom.spdx.json"
          syft "${IMAGE}@${DIGEST}" -o cyclonedx-json > "gghstats-xui_${{ steps.ver.outputs.version }}_image_sbom.cyclonedx.json"

      - name: Cosign sign (keyless)
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          COSIGN_EXPERIMENTAL: "1"
        run: |
          cosign sign --yes "ghcr.io/hrodrig/gghstats-xui@${DIGEST}"

      - name: Upload SBOM assets to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            gghstats-xui_${{ steps.ver.outputs.version }}_image_sbom.spdx.json
            gghstats-xui_${{ steps.ver.outputs.version }}_image_sbom.cyclonedx.json
          generate_release_notes: true
